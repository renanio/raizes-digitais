<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Instituto Raízes Digitais: educação gratuita em programação e inteligência artificial.">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/main.js"></script>
  <title>Instituto Raízes Digitais | Tecnologia que transforma futuros</title>
</head>
<body>
  <header>
    <picture>
      <source srcset="assets/img/logo-raizes-digitais.svg" type="image/svg+xml">
      <source srcset="assets/img/logo-raizes-digitais.webp" type="image/webp">
      <img src="assets/img/logo-raizes-digitais.png" alt="Logotipo do Instituto Raízes Digitais: uma árvore com raízes em forma de circuito eletrônico" width="120" height="120">
    </picture>
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="menu-botao"><span class="menu-icone" aria-hidden="true"></span>Menu</label>
    <nav aria-label="Menu principal">
      <ul>
        <li><a href="#/inicio">Início</a></li>
        <li class="tem-submenu">
          <a href="#/projetos">Projetos</a>
          <ul>
            <li><a href="#/projetos/frentes">Frentes de atuação</a></li>
            <li><a href="#/projetos/como-participar">Como participar</a></li>
            <li><a href="#/projetos/protecao-menores">Proteção de menores</a></li>
          </ul>
        </li>
        <li><a href="#/cadastro">Faça parte</a></li>
      </ul>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer>
    <h2>Contato</h2>
    <address>
      <p>E-mail: <a href="mailto:contato@raizesdigitais.org.br">contato@raizesdigitais.org.br</a></p>
      <p>Telefone/WhatsApp: <a href="tel:+5500900000000">(00) 90000-0000</a></p>
      <p>Redes sociais: @raizesdigitais</p>
    </address>
    <p>&copy; 2026 Instituto Raízes Digitais</p>
  </footer>

  <template id="tpl-card-projeto">
    <article>
      <h3 data-campo="nome"></h3>
      <p class="badges"></p>
      <p data-campo="descricao"></p>
      <ul>
        <li>Público: <span data-campo="publico"></span></li>
        <li>Duração: <span data-campo="duracao"></span></li>
        <li>Formato: <span data-campo="formato"></span></li>
      </ul>
    </article>
  </template>

  <template id="tpl-badge">
    <span class="badge"></span>
  </template>

  <template id="tpl-alerta">
    <p class="alerta" role="status"><span><strong data-campo="titulo"></strong> <span data-campo="mensagem"></span></span></p>
  </template>
</body>
</html>
